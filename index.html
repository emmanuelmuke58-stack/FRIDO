<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rwanda Opportunities - More Opportunities. A Stronger Rwanda.</title>
    <meta name="description" content="More Opportunities. A Stronger Rwanda. A trusted online platform for news, jobs, scholarships, tenders, and more." />
    <meta property="og:title" content="Rwanda Opportunities - More Opportunities. A Stronger Rwanda." />
    <meta property="og:description" content="More Opportunities. A Stronger Rwanda. A trusted online platform for news, jobs, scholarships, tenders, and more." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Rwanda Opportunities - More Opportunities. A Stronger Rwanda." />
    <meta name="twitter:description" content="More Opportunities. A Stronger Rwanda. A trusted online platform for news, jobs, scholarships, tenders, and more." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Rwanda Opportunities",
            "description": "A trusted online platform providing verified Rwanda News, Job Opportunities, Scholarships, Tenders and Other Opportunities.",
            "address": {
              "@type": "PostalAddress",
              "addressLocality": "Kigali",
              "addressCountry": "RW"
            }
          },
          {
            "@type": "WebSite",
            "name": "Rwanda Opportunities",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "/search?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
